{% extends "base.html" %} {% block content %}

<div class="d-flex justify-content-between align-items-center mb-4">
    <div>
        <h2 class="fw-bold mb-1">Edit Product</h2>
        <p class="text-muted mb-0">Update product details and pricing.</p>
    </div>
    <a href="{{ url_for('products') }}" class="btn btn-outline-secondary">← Back to Products</a>
</div>

<div class="card border-0 shadow-sm">
    <div class="card-body p-4">
        <form method="POST">
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Product / Service Name</label>
                    <input name="name" class="form-control" value="{{ product.get('name', '') }}" required>
                </div>
                <div class="col-md-3">
                    <label class="form-label fw-semibold">Price</label>
                    <input name="price" type="number" step="0.01" min="0" class="form-control" value="{{ product.get('price', 0) }}" required>
                </div>
                <div class="col-md-3">
                    <label class="form-label fw-semibold">Tax %</label>
                    <input name="tax" type="number" step="0.01" min="0" class="form-control" value="{{ product.get('tax', 18) }}">
                </div>
            </div>

            <div class="mt-4 d-flex gap-2">
                <button type="submit" class="btn btn-success px-4">
                    <i class="bi bi-check-circle me-1"></i> Save Changes
                </button>
                <a href="{{ url_for('products') }}" class="btn btn-outline-secondary px-4">Cancel</a>
            </div>
        </form>
    </div>
</div>

{% endblock %}
