{% extends "base.html" %}{% block content %}
<div class="d-flex justify-content-between mb-4"><h2 class="fw-bold">Products</h2><button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#productModal">+ Add Product</button></div>
<div class="card border-0 shadow-sm"><div class="card-body table-responsive"><table class="table align-middle"><thead><tr><th>Product</th><th>Price</th><th>Tax %</th><th></th></tr></thead><tbody>
{% for p in products %}<tr><td class="fw-semibold">{{ p.name }}</td><td>₹{{ "%.2f"|format(p.price) }}</td><td>{{ p.tax }}%</td><td><a class="btn btn-sm btn-outline-danger" href="{{ url_for('delete_product', id=p._id) }}" onclick="return confirm('Delete product?')">Delete</a></td></tr>
{% else %}<tr><td colspan="4" class="text-center text-muted py-4">No products found.</td></tr>{% endfor %}</tbody></table></div></div>
<div class="modal fade" id="productModal"><div class="modal-dialog"><form method="post" class="modal-content"><div class="modal-header"><h5>Add Product</h5><button class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body"><input name="name" class="form-control mb-3" placeholder="Product/service name" required><input name="price" type="number" step="0.01" class="form-control mb-3" placeholder="Price" required><input name="tax" type="number" step="0.01" value="18" class="form-control" placeholder="Tax %"></div><div class="modal-footer"><button class="btn btn-primary">Save Product</button></div></form></div></div>
{% endblock %}
