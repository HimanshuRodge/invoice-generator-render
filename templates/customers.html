{% extends "base.html" %}{% block content %}
<div class="d-flex justify-content-between mb-4"><h2 class="fw-bold">Customers</h2><button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#customerModal">+ Add Customer</button></div>
<div class="card border-0 shadow-sm"><div class="card-body table-responsive"><table class="table align-middle"><thead><tr><th>Name</th><th>Phone</th><th>Email</th><th>GSTIN</th><th></th></tr></thead><tbody>
{% for c in customers %}<tr><td class="fw-semibold">{{ c.name }}</td><td>{{ c.phone }}</td><td>{{ c.email }}</td><td>{{ c.gstin or "-" }}</td><td><a class="btn btn-sm btn-outline-danger" href="{{ url_for('delete_customer', id=c._id) }}" onclick="return confirm('Delete customer?')">Delete</a></td></tr>
{% else %}<tr><td colspan="5" class="text-center text-muted py-4">No customers found.</td></tr>{% endfor %}</tbody></table></div></div>
<div class="modal fade" id="customerModal"><div class="modal-dialog"><form method="post" class="modal-content"><div class="modal-header"><h5>Add Customer</h5><button class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body">
<input name="name" class="form-control mb-3" placeholder="Customer name" required><input name="phone" class="form-control mb-3" placeholder="Phone"><input name="email" type="email" class="form-control mb-3" placeholder="Email"><textarea name="address" class="form-control mb-3" placeholder="Address"></textarea><input name="gstin" class="form-control" placeholder="GSTIN">
</div><div class="modal-footer"><button class="btn btn-primary">Save Customer</button></div></form></div></div>
{% endblock %}
