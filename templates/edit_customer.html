{% extends "base.html" %} {% block content %}

<div class="d-flex justify-content-between align-items-center mb-4">
    <div>
        <h2 class="fw-bold mb-1">Edit Customer</h2>
        <p class="text-muted mb-0">Update customer details.</p>
    </div>
    <a href="{{ url_for('customers') }}" class="btn btn-outline-secondary">← Back to Customers</a>
</div>

<div class="card border-0 shadow-sm">
    <div class="card-body p-4">
        <form method="POST">
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Customer Name</label>
                    <input name="name" class="form-control" value="{{ customer.get('name', '') }}" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Phone</label>
                    <input name="phone" class="form-control" value="{{ customer.get('phone', '') }}">
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Email</label>
                    <input name="email" type="email" class="form-control" value="{{ customer.get('email', '') }}">
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold">GSTIN</label>
                    <input name="gstin" class="form-control" value="{{ customer.get('gstin', '') }}">
                </div>
                <div class="col-12">
                    <label class="form-label fw-semibold">Address</label>
                    <textarea name="address" class="form-control" rows="3">{{ customer.get('address', '') }}</textarea>
                </div>
            </div>

            <div class="mt-4 d-flex gap-2">
                <button type="submit" class="btn btn-success px-4">
                    <i class="bi bi-check-circle me-1"></i> Save Changes
                </button>
                <a href="{{ url_for('customers') }}" class="btn btn-outline-secondary px-4">Cancel</a>
            </div>
        </form>
    </div>
</div>

{% endblock %}
